name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Find and Configure CMake
      run: |
        # Автоматически ищем папку, в которой лежит CMakeLists.txt
        CMAKE_DIR=$(find . -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
        echo "Found CMakeLists.txt in: $CMAKE_DIR"
        
        cmake -S "$CMAKE_DIR" -B build \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
          -DCMAKE_OSX_ARCHITECTURES="arm64"

    - name: Build Library
      run: |
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CounterFlameDylib
        path: build/libCounterFlameDylib.dylib
